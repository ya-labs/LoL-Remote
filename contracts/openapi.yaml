openapi: 3.1.0
info:
  title: LoL Remote - API local do agente
  version: 1.0.0-draft
  description: |
    API HTTP do agente desktop. O agente escuta somente em 127.0.0.1 e é
    publicado apenas dentro da tailnet pelo Tailscale Serve (HTTPS). Nunca é
    exposto na internet pública.

    Autenticação: ainda não implementada. O pareamento por QR e o WebAuthn/Face ID
    (v0.5) vão exigir um token de sessão em todas as rotas, exceto /health.
    Até lá, a proteção é a própria tailnet, com Grants por usuário.

    Depois que a sessão WebRTC abre, o controle usa o canal de dados "control",
    descrito em schemas/control-message.schema.json.
  license:
    name: Uso pessoal, beta fechado
servers:
  - url: https://{machine}.{tailnet}.ts.net
    description: Tailscale Serve apontando para 127.0.0.1:5080
    variables:
      machine:
        default: pc
      tailnet:
        default: exemplo
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Verifica se o agente está no ar.
      responses:
        '200':
          description: Agente em execução.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/time:
    get:
      operationId: getTime
      summary: Relógio do agente, para o celular sincronizar.
      description: |
        O celular faz várias chamadas, fica com a de menor ida e volta e estima
        a diferença entre os relógios. Esse horário vai no campo sentAt dos
        comandos de input.
      responses:
        '200':
          description: Horário atual do agente.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTime'
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Abre uma sessão WebRTC a partir da oferta SDP do celular.
      description: |
        O celular cria a oferta (vídeo somente recepção e canal de dados
        "control") e envia o SDP completo. O agente responde com o SDP de
        resposta. Uma nova sessão encerra a anterior.
      requestBody:
        required: true
        content:
          application/sdp:
            schema:
              type: string
              maxLength: 65536
      responses:
        '201':
          description: Sessão criada; corpo é o SDP de resposta.
          content:
            application/sdp:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/diagnostics/stats:
    post:
      operationId: postStats
      summary: Estatísticas de recepção enviadas pelo celular.
      description: |
        Usadas para diagnóstico local de conexão e latência. Não contêm
        endereços IP, coordenadas de toque nem texto digitado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientStats'
      responses:
        '204':
          description: Recebido.
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Erro no formato Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
          description: Versão do agente.
    ServerTime:
      type: object
      additionalProperties: false
      required: [serverTimeMs]
      properties:
        serverTimeMs:
          type: integer
          description: Milissegundos de um relógio monotônico do agente.
    ClientStats:
      type: object
      description: Todos os campos são opcionais; valores ausentes significam "não medido".
      additionalProperties: false
      properties:
        scenario:
          enum: [wifi, cellular, other]
        connectionState:
          type: string
        codec:
          type: [string, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        fps:
          type: [number, 'null']
        rttMs:
          type: [integer, 'null']
        packetsLost:
          type: [integer, 'null']
        freezeCount:
          type: [integer, 'null']
        jitterBufferMs:
          type: [integer, 'null']
        latencyP50Ms:
          type: [integer, 'null']
        latencyP95Ms:
          type: [integer, 'null']
        candidateTypes:
          type: [string, 'null']
          description: Tipos de candidato ICE local/remoto, sem endereços.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          description: Código estável para o celular decidir o que mostrar.
          enum:
            - invalid-offer
            - payload-too-large
            - target-unavailable
            - encoder-unavailable
            - unauthorized
            - internal-error
